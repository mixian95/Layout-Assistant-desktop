[package]
name = "layout-assistant-desktop"
version = "0.6.0"
description = "Desktop shell for Layout Assistant"
authors = ["Layout Assistant contributors"]
edition = "2021"

[lib]
name = "layout_assistant_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-single-instance = "=2.4.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
urlencoding = "=2.1.3"
sha2 = "=0.10.9"
